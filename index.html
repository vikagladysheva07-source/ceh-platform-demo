<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Платформа цеха — схема</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F2F3F7; --card:#FFFFFF; --line:#E6E8EF; --ink:#12141C; --muted:#7A8094; --soft:#F6F7FB;
  --blue:#2D5BFF; --blue-deep:#1B3FD0; --blue-soft:#E3EAFF; --blue-mid:#9DB4FF;
  --black:#0E0F14; --green:#16A36A; --green-soft:#DDF5EA; --red:#E5484D; --red-soft:#FDE6E7;
  --r:20px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;font-weight:700;font-size:17px}
.brand i{width:30px;height:30px;border-radius:10px;background:var(--blue);display:grid;place-items:center}
.brand i svg{width:17px;height:17px;stroke:#fff}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:-2px}
.grp{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:12px;font-weight:500;font-size:14.5px;color:#3a3f50}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 18px}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--black);color:#fff}
.nav .tag{margin-left:auto;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue-deep)}
.nav.on .tag{background:rgba(255,255,255,.16);color:#fff}
.promo{margin-top:auto;border-radius:18px;padding:16px;color:#fff;background:linear-gradient(150deg,#2D5BFF 0%,#1B3FD0 100%)}
.promo b{display:block;font-size:15px;margin-bottom:4px}
.promo p{margin:0 0 12px;font-size:12.5px;opacity:.85}
.promo .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;margin-bottom:12px}
.promo .bar i{display:block;height:100%;width:34%;background:#fff;border-radius:6px}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:600;font-size:13.5px;background:var(--black);color:#fff}
.btn.white{background:#fff;color:var(--blue-deep)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:var(--blue);color:#fff}
/* main */
.main{padding:26px 30px 60px;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.crumb{color:var(--muted);font-size:13px;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:#3a3f50}
.chip.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue-deep)}
.chip.dark{background:var(--black);color:#fff;border-color:transparent}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
.card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--line);min-width:0}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600;color:#3a3f50}
.card .sub{font-size:12.5px;color:var(--muted)}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:10px 0 6px}
.delta{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--green-soft);color:var(--green)}
.delta.red{background:var(--red-soft);color:var(--red)}
.delta.gray{background:var(--soft);color:var(--muted)}
.card.dark{background:linear-gradient(150deg,#0E1230 0%,#1B3FD0 130%);color:#fff;border:0}
.card.dark h3{color:#fff}
.card.dark .sub{color:rgba(255,255,255,.7)}
.card.dark p{margin:8px 0 14px;color:rgba(255,255,255,.85);font-size:14px}
.demo{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);vertical-align:middle}
/* bars */
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;margin-top:16px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%}
.bars i{display:block;width:100%;border-radius:12px;background:var(--blue-soft)}
.bars i.on{background:var(--blue)}
.bars i.k{background:var(--black)}
.bars span{font-size:12px;color:var(--muted)}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:#3a3f50;white-space:nowrap}
.pill.blue{background:var(--blue-soft);color:var(--blue-deep)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.dark{background:var(--black);color:#fff}
.prog{height:8px;border-radius:8px;background:var(--blue-soft);overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:8px}
.prog.red i{background:var(--red)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.stage{background:var(--soft);border-radius:16px;padding:14px;position:relative}
.stage b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stage span{font-size:12.5px;color:var(--muted)}
.stage.done{background:var(--blue-soft)}
.stage.now{background:var(--black);color:#fff}
.stage.now span{color:rgba(255,255,255,.7)}
/* architecture */
.arch{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:14px;align-items:stretch}
.zone{background:var(--soft);border:1px dashed #cfd4e3;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.zone h4{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.zone.core{background:var(--card);border:2px solid var(--blue)}
.mod{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px;cursor:pointer;text-align:left;width:100%}
.mod small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.mod.now{background:var(--blue);border-color:var(--blue);color:#fff}
.mod.now small{color:rgba(255,255,255,.75)}
.mod.later{background:var(--card);border-style:dashed}
.mod .n{margin-left:auto;font-size:11px;opacity:.7;font-weight:600}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.arrow{display:flex;justify-content:center;color:var(--blue);font-weight:700;font-size:18px;line-height:1}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.step{background:var(--soft);border-radius:16px;padding:14px;position:relative}
.step i{font-style:normal;display:block;font-size:11.5px;font-weight:700;color:var(--blue);letter-spacing:.08em;margin-bottom:6px}
.step b{display:block;font-size:14px;margin-bottom:2px}
.step span{font-size:12.5px;color:var(--muted)}
.step:not(:last-child)::after{content:"\2192";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--blue);font-weight:700;z-index:1;background:var(--card);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:13px}
.flow.v .step::after{display:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.legend .a::before{background:var(--blue)}
.legend .b::before{border:1.5px dashed #9aa1b5;background:var(--card)}
/* heat */
.heat{display:grid;grid-template-columns:150px repeat(5,1fr);gap:8px;align-items:center;margin-top:14px;font-size:13px}
.heat .h{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center}
.cell{height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--blue-soft);color:var(--blue-deep)}
.cell.m{background:var(--blue-mid);color:#0b1f6b}
.cell.h2{background:var(--blue);color:#fff}
.cell.low{background:var(--red-soft);color:var(--red)}
/* phone */
.phonewrap{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.phone{width:min(320px,100%);border-radius:44px;background:var(--black);padding:12px;box-shadow:0 20px 50px rgba(18,20,28,.18);margin:0 auto}
.screen{background:var(--bg);border-radius:34px;padding:22px 16px 20px;min-height:600px}
.screen h4{margin:0 0 2px;font-size:19px;font-weight:800}
.screen .hi{color:var(--muted);font-size:13px;margin-bottom:14px}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.opt button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;font-weight:600;font-size:13.5px;min-height:48px}
.opt button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-deep)}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:8px;margin:8px 0 14px}
.qty button{width:52px;height:52px;border-radius:14px;border:0;background:var(--soft);font-size:24px;font-weight:600}
.qty b{font-size:32px;font-weight:800}
.save{width:100%;border:0;border-radius:16px;padding:16px;background:var(--blue);color:#fff;font-weight:700;font-size:16px}
.toast{margin-top:12px;background:var(--green-soft);color:var(--green);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px;display:none}
.toast.on{display:block}
.mine{background:var(--card);border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.mine b{font-size:20px;font-weight:800}
/* agents */
.agent{display:flex;flex-direction:column;gap:10px}
.agent .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.agent b{font-size:16px}
.agent p{margin:0;color:#3a3f50;font-size:13.5px}
.note{background:var(--blue-soft);color:var(--blue-deep);border-radius:14px;padding:12px 16px;font-size:13.5px;font-weight:500;margin-bottom:16px}
.actions{display:flex;gap:8px}
.mut{color:var(--muted)}
button.card{font:inherit;color:inherit;cursor:pointer;width:100%;text-align:left;transition:transform .15s,box-shadow .15s}
button.card:hover{transform:translateY(-2px);box-shadow:0 18px 34px -18px rgba(18,20,28,.25)}
button.chip{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.pipe{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1fr;gap:10px;align-items:stretch;margin-top:18px}
.pnode{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:2px;min-height:150px}
.pnode.on{background:linear-gradient(165deg,#F4F7FF,#E4ECFF);border-color:transparent}
.pnode .pn{font-size:11px;font-weight:700;letter-spacing:.14em;color:#9AA1B8}
.pnode b{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-top:6px;white-space:nowrap}
.pnode .pl{font-size:13px;font-weight:650;color:#3A4056}
.pbar{margin-top:auto;padding-top:14px}
.pbar i{display:block;height:8px;border-radius:8px;background:linear-gradient(90deg,#6C8CFF,#2D5BFF)}
.pcon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:64px;max-width:76px;text-align:center}
.parrow{font-size:22px;color:#B6BCD0;line-height:1}
.pwait{font-size:11.5px;font-weight:650;color:var(--muted);line-height:1.25}
.pcon.hot .parrow{color:var(--red)}
.pcon.hot .pwait{color:var(--red);background:var(--red-soft);border-radius:10px;padding:4px 8px}
.pdef{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:13px;color:var(--muted);font-weight:650}
.pdef b{font-size:15px;color:var(--red);background:var(--red-soft);padding:3px 12px;border-radius:99px}
.donutwrap{display:flex;align-items:center;gap:18px;margin-top:14px;flex-wrap:wrap}
.donut{position:relative;width:148px;height:148px;flex:0 0 148px}
.donut svg{width:100%;height:100%}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dc b{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}
.dc span{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.legendlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px}
.legendlist li{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:550;color:#3A4056}
.legendlist li i{width:10px;height:10px;border-radius:4px;flex:0 0 10px}
.legendlist li b{margin-left:auto}
.trend{width:100%;height:auto;display:block;margin-top:10px}
.tlegend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:6px}
.tlegend span::before{content:"";display:inline-block;width:18px;height:3px;border-radius:3px;margin-right:7px;vertical-align:3px;background:var(--blue)}
.tlegend .p::before{background:repeating-linear-gradient(90deg,#B3BAD0 0 5px,transparent 5px 9px)}
.hbars{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.hbl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600;margin-bottom:6px}
.hbt{height:12px;border-radius:12px;background:#EEF1F8;overflow:hidden}
.hbt i{display:block;height:100%;border-radius:12px}
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g32{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 160px}
.selwrap{position:relative}
.selbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-width:150px;border:1px solid rgba(15,18,32,.10);background:#fff;border-radius:14px;padding:11px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.selbtn:hover{border-color:rgba(45,91,255,.45)}
.selbtn[aria-expanded=true]{border-color:var(--blue);box-shadow:0 0 0 4px rgba(45,91,255,.12)}
.selbtn .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbtn svg{width:16px;height:16px;flex:0 0 16px;stroke:#8A91A8;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.selbtn[aria-expanded=true] svg{transform:rotate(180deg);stroke:var(--blue)}
.selback{position:fixed;inset:0;z-index:60;background:transparent}
.selmenu{position:fixed;z-index:61;width:max-content;max-width:min(380px,92vw);max-height:300px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 6px rgba(15,18,32,.06),0 30px 60px -20px rgba(15,18,32,.35);padding:6px;list-style:none;margin:0}
.selmenu li{margin:0}
.selopt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:12px;font:inherit;font-weight:600;font-size:14px;text-align:left;color:var(--ink);cursor:pointer}
.selopt:hover{background:var(--soft)}
.selopt.on{color:var(--blue-deep);background:var(--blue-soft)}
.selopt .tick{margin-left:auto;width:16px;height:16px;stroke:var(--blue);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:110px}
.colhead{display:flex;justify-content:space-between;align-items:center;padding:4px 6px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tcard.hot{border-color:rgba(229,72,77,.35)}
.trow{display:flex;gap:10px;align-items:flex-start}
.ttitle{font-weight:600;line-height:1.3}
.pdot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 10px;background:#C9CFE3}
.pdot.HIGH{background:var(--red)}
.pdot.NORMAL{background:var(--blue)}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.av{width:24px;height:24px;border-radius:8px;background:var(--blue-soft);color:var(--blue-deep);display:inline-grid;place-items:center;font-weight:800;font-size:11px;flex:0 0 24px}
.tass{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.moves{display:flex;gap:6px;flex-wrap:wrap}
.moves .btn{padding:7px 12px;font-size:12.5px;border-radius:11px}
.attn{display:flex;flex-direction:column}
.attn button{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.attn button:last-child{border-bottom:0}
.attn button:hover{background:#F9FAFE}
.attn .cnt{min-width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--blue-soft);color:var(--blue-deep)}
.attn .cnt.red{background:var(--red-soft);color:var(--red)}
.attn .txt{flex:1;font-weight:600;line-height:1.3}
.attn .txt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.attn .go{color:#B6BCD0;font-size:22px}
.trow2{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.trow2 .prog{min-width:0}
.trow2 .tt{flex:1;min-width:0;font-weight:600;line-height:1.3}
.chk{width:30px;height:30px;border-radius:10px;border:1.5px solid #C9CFE3;background:#fff;display:grid;place-items:center;padding:0;color:transparent;flex:0 0 30px}
.chk:hover{border-color:var(--blue);color:var(--blue)}
.chk svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
.addrow input,.addrow select{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;flex:1 1 160px;min-width:0}
.who1c{display:flex;align-items:center;gap:10px;font-weight:600}
/* ===== Тёмная студия ===== */
:root{--bg:#090A0F;--card:rgba(255,255,255,.045);--solid:#14161F;--line:rgba(255,255,255,.09);--ink:#F2F4FA;--muted:#8D93A8;--soft:rgba(255,255,255,.06);--blue:#5B8CFF;--blue-deep:#9DB9FF;--blue-soft:rgba(91,140,255,.16);--blue-mid:#7BA2FF;--black:#F2F4FA;--green:#43D9A0;--green-soft:rgba(67,217,160,.14);--red:#FF6B6F;--red-soft:rgba(255,107,111,.14);--r:22px;color-scheme:dark}
body{background:radial-gradient(900px 480px at 85% -10%,rgba(80,120,255,.26),transparent 60%),radial-gradient(640px 380px at 0% 20%,rgba(61,214,245,.09),transparent 60%),#090A0F;background-attachment:fixed}
.side{background:rgba(12,13,19,.78);backdrop-filter:blur(18px)}
.brand i{background:linear-gradient(145deg,#6C9BFF,#3F6FF5);box-shadow:0 8px 18px -6px rgba(91,140,255,.65)}
.nav{color:#B6BCD0}
.nav.on{background:linear-gradient(180deg,rgba(91,140,255,.30),rgba(91,140,255,.12));color:#fff;box-shadow:inset 0 0 0 1px rgba(91,140,255,.38),0 10px 24px -12px rgba(91,140,255,.55)}
.nav.on svg{stroke:#BFD0FF}
.promo{background:linear-gradient(150deg,#1B2E8E 0%,#3D6BFF 100%)}
.btn{background:linear-gradient(180deg,#6C9BFF,#3F6FF5);color:#fff;box-shadow:0 12px 28px -10px rgba(91,140,255,.8)}
.btn.white{background:#fff;color:#1B3FD0}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.blue{background:linear-gradient(180deg,#6C9BFF,#3F6FF5);color:#fff}
.chip{color:var(--ink)}
.chip.dark{background:#F2F4FA;color:#0E0F14}
.card{box-shadow:0 20px 50px -24px rgba(0,0,0,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h3{color:var(--ink)}
.big{background:linear-gradient(180deg,#fff,#B9C8FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.card.dark{background:linear-gradient(150deg,#101635 0%,#1B2E8E 60%,#3D6BFF 140%)}
.bars i{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05))}
.bars i.on{background:linear-gradient(180deg,#6C9BFF,#3F6FF5)}
.bars i.k{background:#F2F4FA}
.pill{color:var(--ink)}
.pill.dark{background:#F2F4FA;color:#0E0F14}
.prog{background:rgba(255,255,255,.09)}
.prog i{background:linear-gradient(90deg,#3DD6F5,#5B8CFF)}
.prog.red i{background:linear-gradient(90deg,#FFA3A6,#FF6B6F)}
.stage.done{background:rgba(91,140,255,.14)}
.stage.now{background:linear-gradient(160deg,#6C9BFF,#3F6FF5);color:#fff}
.stage.now span{color:rgba(255,255,255,.8)}
.zone{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.03)}
.zone.core{background:rgba(91,140,255,.07)}
.mod.now{background:linear-gradient(160deg,#6C9BFF,#3F6FF5);border-color:transparent}
.mod.later{background:rgba(255,255,255,.03)}
.legend .b::before{border-color:#8D93A8;background:transparent}
.cell{background:rgba(91,140,255,.14)}
.cell.m{background:linear-gradient(160deg,#9DB9FF,#7BA2FF);color:#0A1A5C}
.cell.h2{background:linear-gradient(160deg,#6C9BFF,#3F6FF5)}
.phone{background:#0E0F14}
.screen{background:#0C0D13}
.qty button{color:var(--ink)}
.save{background:linear-gradient(180deg,#6C9BFF,#3F6FF5);box-shadow:0 20px 40px -14px rgba(91,140,255,.8)}
.agent p{color:var(--ink)}
.note{background:linear-gradient(135deg,rgba(91,140,255,.16),rgba(61,214,245,.08));color:#C4D4FF;border:1px solid rgba(91,140,255,.28)}
button.card:hover{box-shadow:0 20px 40px -18px rgba(0,0,0,.9)}
.pnode.on{background:rgba(91,140,255,.10);border-color:rgba(91,140,255,.24)}
.pnode .pn{color:var(--muted)}
.pnode .pl{color:var(--ink)}
.pbar i{background:linear-gradient(90deg,#3DD6F5,#5B8CFF)}
.parrow{color:var(--muted)}
.legendlist li{color:var(--ink)}
.tlegend .p::before{background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 5px,transparent 5px 9px)}
.hbt{background:rgba(255,255,255,.08)}
.selbtn{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.05)}
.selbtn:hover{border-color:rgba(91,140,255,.55)}
.selbtn[aria-expanded=true]{box-shadow:0 0 0 4px rgba(91,140,255,.18)}
.selmenu{background:var(--solid);border-color:rgba(255,255,255,.12);box-shadow:0 30px 70px -20px rgba(0,0,0,.9)}
.col{background:rgba(255,255,255,.025)}
.tcard{background:rgba(255,255,255,.05)}
.tcard.hot{border-color:rgba(255,107,111,.45)}
.pdot{background:rgba(255,255,255,.3)}
.av{background:linear-gradient(145deg,rgba(91,140,255,.30),rgba(61,214,245,.18));color:#CFDBFF}
.attn button:hover{background:rgba(255,255,255,.04)}

.chk{border-color:rgba(255,255,255,.28);background:transparent}
.addrow input,.addrow select{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:var(--ink)}
.addrow input::placeholder{color:var(--muted)}
@media (max-width:1100px){
  .pipe{grid-template-columns:1fr auto 1fr auto 1fr}
  .kpi3{grid-template-columns:1fr 1fr}
  .g32{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:1fr 1fr} .g21{grid-template-columns:1fr}
  .arch{grid-template-columns:1fr} .phonewrap{grid-template-columns:1fr}
  .flow,.stages{grid-template-columns:1fr 1fr}
  .step:not(:last-child)::after{display:none}
}
@media (max-width:820px){
  .selback{background:rgba(0,0,0,.6)}
  .selmenu{left:10px !important;right:10px;top:auto !important;bottom:10px;width:auto;min-width:0 !important;max-width:none;max-height:64vh;border-radius:26px;padding:10px}
  .selopt{min-height:54px;font-size:16px;padding:12px 14px}
  .selbtn{min-height:48px;font-size:16px}
  .pipe{grid-template-columns:1fr;gap:6px}
  .pcon{flex-direction:row;max-width:none;min-width:0;justify-content:flex-start;gap:10px;padding:0 6px;min-height:28px}
  .parrow{transform:rotate(90deg)}
  .pnode{min-height:0;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px;padding:12px 16px}
  .pnode .pn{display:none}
  .pnode b{font-size:26px;margin:0;grid-column:1;grid-row:1}
  .pnode .pl{grid-column:2;grid-row:1}
  .pbar{grid-column:1/-1;grid-row:2;padding-top:8px}
  .pdef{justify-content:flex-start}
  .kpi3{grid-template-columns:1fr}
  .donutwrap{justify-content:center}
  .board{grid-template-columns:1fr}
  .cardrows thead{display:none}
  .cardrows,.cardrows tbody,.cardrows tr,.cardrows td{display:block;width:100% !important}
  .cardrows tr{background:var(--soft);border-radius:16px;padding:8px 14px;margin-bottom:10px;border:1px solid var(--line)}
  .cardrows td{border:0 !important;padding:6px 0 !important;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:right}
  .cardrows td::before{content:attr(data-l);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:0 0 auto}
  .cardrows td .prog{width:130px;min-width:0}
  .cardrows td.name{white-space:normal}
  .tbl.stk,.tbl.stk tbody,.tbl.stk tr,.tbl.stk td{display:block;width:100%}
  .tbl.stk tr{padding:10px 0;border-bottom:1px solid var(--line)}
  .tbl.stk tr:last-child{border-bottom:0}
  .tbl.stk td{border:0;padding:3px 0}
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:12px;gap:6px;border-right:0;border-bottom:1px solid var(--line);align-items:center}
  .side .brand{padding:0 8px 0 0;flex:0 0 auto} .side .brand small{display:none}
  .grp,.promo{display:none}
  .nav{flex:0 0 auto;width:auto;white-space:nowrap;padding:9px 13px}
  .nav .tag{display:none}
  .main{padding:20px 16px 48px}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .top h1{font-size:23px}
  .flow,.stages{grid-template-columns:1fr}
  .heat{grid-template-columns:96px repeat(5,1fr);gap:5px;font-size:12px}
  .cell{height:38px;font-size:13px}
  .mods{grid-template-columns:1fr}
}

 ['АГЕНТЫ',[['agents','Агенты','bot']]]
];
var TITLES={overview:['Обзор','Платформа / Обзор'],tasks:['Задачи','Платформа / Задачи и команда'],ret:['Возвраты','Следующий этап / Возвраты'],fin:['Финансы','Следующий этап / Доходы и расходы'],arch:['Архитектура платформы','Платформа / Архитектура'],batches:['Партии','Производство / Партии'],pay:['Выработка и зарплата','Производство / Зарплата'],app:['Приложение швеи','Производство / Телефон швеи'],stock:['Остатки','Склад / Остатки'],dict:['Справочники','Данные / Справочники'],mat:['Материалы','Следующий этап / Материалы'],mp:['Площадки','Следующий этап / Wildberries и Ozon'],plan:['Планирование','Следующий этап / Планирование'],agents:['Агенты','Агенты / Команда']};

function head(extra){
  var t=TITLES[cur];

function bars(vals,hi,kdark){
  var m=Math.max.apply(null,vals.map(function(v){return v[1]}));
  return '<div class="bars">'+vals.map(function(v,i){return '<div><i class="'+(i===hi?'on':'')+(kdark===i?' k':'')+'" style="height:'+Math.round(v[1]/m*100)+'%"></i><span>'+v[0]+'</span></div>'}).join('')+'</div>';
}

 {id:1,t:'Проверить спорные записи выработки',who:'Технолог',due:'Сегодня',st:'TODO',pr:'HIGH',area:'Производство'},
 {id:2,t:'Пересчитать П-014 на упаковке и сверить с глажкой',who:'Кладовщик',due:'Сегодня',st:'DOING',pr:'HIGH',area:'Склад',batch:'П-014'},

 {id:5,t:'Подготовить отгрузку на Коледино',who:'Кладовщик',due:'Через 3 дн.',st:'TODO',pr:'NORMAL',area:'Площадки'},

function av(n){return '<span class="av">'+n.charAt(0)+'</span>'}

function donut(segs,center,sub){

 '</div></div>'+
 '<div class="grid g3" style="margin-top:16px">'+
  '<div class="card"><h3>Роли</h3><p class="mut" style="margin:6px 0 0;font-size:14px">Руководитель видит всё. Технолог правит справочники, выработку и остатки, все действия в журнале. Кладовщик ведёт приёмку и склад. Швея видит только свой ввод и свои начисления.</p></div>'+
  '<div class="card"><h3>Принципы</h3><p class="mut" style="margin:6px 0 0;font-size:14px">Ввод один раз. Операции и изделия считаются отдельно. Каждая правка в журнале. Решения с денежным риском подтверждает человек.</p></div>'+
  '<div class="card"><h3>Данные</h3><p class="mut" style="margin:6px 0 0;font-size:14px">Сервер в России. Ключи доступа только на чтение. Агенты не получают фамилии и зарплаты. Электронная подпись остаётся на вашем сервере.</p></div>'+
 '</div>';
};

function enhance(){
  document.querySelectorAll('#main .scroll table.tbl').forEach(function(tb){
    var heads=[].slice.call(tb.querySelectorAll('thead th')).map(function(th){return th.textContent});
    tb.querySelectorAll('tbody tr').forEach(function(tr){[].slice.call(tr.children).forEach(function(td,i){td.setAttribute('data-l',heads[i]||'')})});
    tb.classList.add('cardrows');
  });
}
function render(){
  side();
  document.getElementById('main').innerHTML=V[cur]();
  enhance();
  window.scrollTo(0,0);
  try{document.querySelector('.nav.on').scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
function go(k){cur=k;try{history.replaceState(null,'','#'+k)}catch(e){};render()}
function rr(){var y=window.scrollY;document.getElementById('main').innerHTML=V[cur]();enhance();window.scrollTo(0,y)}
document.addEventListener('click',function(e){
  var rr2=e.target.closest('[data-rres]'); if(rr2){var q=rr2.dataset.rres.split('|');RET.forEach(function(x){if(x.id==q[0]){if(q[1]==='restock'){x.st='RESTOCKED';BACK+=x.q}else x.st='WRITEOFF'}});rr();return}
  var ra=e.target.closest('#rtAdd'); if(ra){var qn=parseInt(document.getElementById('rtQ').value,10);if(!(qn>0))return;RET.unshift({id:++RID,m:document.getElementById('rtM').dataset.val,q:qn,r:document.getElementById('rtR').value||'Без причины',st:'RECEIVED'});rr();return}
  var cf=e.target.closest('#cfAdd'); if(cf){var am=parseFloat(String(document.getElementById('cfAmt').value).replace(',','.'));var ct=(document.getElementById('cfCat').value||'').trim();if(!(am>0)||ct.length<2){document.getElementById('cfCat').focus();return}CASH.unshift({k:document.getElementById('cfKind').dataset.val,c:ct,a:am,d:'Добавлено вручную'});rr();return}
  var sb=e.target.closest('[data-sel]'); if(sb){if(sb.getAttribute('aria-expanded')==='true')closeSel();else openSel(sb);return}
  var tv=e.target.closest('[data-tv]'); if(tv){TV=tv.dataset.tv;rr();return}
  var tm=e.target.closest('[data-tmove]'); if(tm){var p=tm.dataset.tmove.split('|');TASKS.forEach(function(x){if(x.id==p[0]){x.st=p[1];if(p[1]==='DONE'){x.over=false;x.due=''}}});rr();return}
  var td=e.target.closest('[data-tdone]'); if(td){TASKS.forEach(function(x){if(x.id==td.dataset.tdone){x.st='DONE';x.over=false;x.due=''}});rr();return}
  var ta=e.target.closest('#taAdd'); if(ta){var inp=document.getElementById('taTitle');var v=(inp.value||'').trim();if(v.length<2){inp.focus();return}var w=document.getElementById('taWho');TASKS.unshift({id:++TID,t:v,who:w?w.dataset.val:'Руководитель',due:'Сегодня',st:'TODO',pr:'NORMAL',area:'Другое'});rr();return}
  var t=e.target.closest('[data-go]'); if(t){if(t.dataset.tvset)TV=t.dataset.tvset;go(t.dataset.go);return}
  var c=e.target.closest('[data-conf]'); if(c){CONF[c.dataset.conf]=1;var y=window.scrollY;document.getElementById('main').innerHTML=V[cur]();enhance();window.scrollTo(0,y);return}
  var m=e.target.closest('[data-m]'); if(m){document.querySelectorAll('#optM button').forEach(function(b){b.classList.remove('on')});m.classList.add('on');return}
  var o=e.target.closest('[data-o]'); if(o){document.querySelectorAll('#optO button').forEach(function(b){b.classList.remove('on')});o.classList.add('on');return}
  if(e.target.id==='qp'){QTY++;document.getElementById('qv').textContent=QTY;return}
  if(e.target.id==='qm'){QTY=Math.max(1,QTY-1);document.getElementById('qv').textContent=QTY;return}
  if(e.target.id==='save'){var t2=document.getElementById('toast');t2.classList.add('on');setTimeout(function(){t2.classList.remove('on')},1800);return}
});
var h=location.hash.replace('#','');
if(h&&V[h])cur=h;
render();
</script>
</body>
</html>
