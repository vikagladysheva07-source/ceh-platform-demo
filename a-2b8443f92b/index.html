function b(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
async function open(pw){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
var out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c));return new TextDecoder().decode(out)}
async function go(pw,silent){try{var h=await open(pw);try{sessionStorage.setItem('k',pw)}catch(e){}document.open();document.write(h);document.close()}catch(e){if(!silent)document.getElementById('e').textContent='Пароль не подошёл'}}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();document.getElementById('e').textContent='Проверяю…';go(document.getElementById('p').value.trim().toLowerCase(),false)});
try{var s=sessionStorage.getItem('k');if(s)go(s,true)}catch(e){}
